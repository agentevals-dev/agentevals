version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels: ["dependencies", "CI"]
    commit-message:
      prefix: "chore(deps):"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["dependencies", "CLI"]
    commit-message:
      prefix: "chore(deps):"
      prefix-development: "chore(deps-dev):"
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      python-google-ai:
        applies-to: version-updates
        patterns:
          - "google-adk"
          - "google-genai"
          - "google-auth*"
      python:
        applies-to: version-updates
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels: ["dependencies", "UI"]
    commit-message:
      prefix: "chore(deps):"
      prefix-development: "chore(deps-dev):"
    cooldown:
      default-days: 5
      semver-major-days: 14
    ignore:
      # Majors need a migration pass; bump these by hand.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "antd"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps):"
    cooldown:
      default-days: 5
    groups:
      docker-base-images:
        applies-to: version-updates
        patterns: ["*"]

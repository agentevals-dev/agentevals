version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "CI"
    commit-message:
      prefix: "chore(deps):"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "CLI"
    commit-message:
      prefix: "chore(deps):"
      prefix-development: "chore(deps-dev):"
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      python-google-ai:
        applies-to: version-updates
        patterns:
          - "google-adk"
          - "google-genai"
          - "google-auth*"
        update-types:
          - "minor"
          - "patch"
      python-development:
        applies-to: version-updates
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      python-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "UI"
    commit-message:
      prefix: "chore(deps):"
      prefix-development: "chore(deps-dev):"
    cooldown:
      default-days: 5
    ignore:
      # react/vite/antd majors require migrations.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      npm-dev-tooling:
        applies-to: version-updates
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-runtime:
        applies-to: version-updates
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps):"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    cooldown:
      default-days: 5
    groups:
      docker-base-images:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

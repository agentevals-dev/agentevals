# ==============================================================================
# Global
# ==============================================================================

# Values a parent chart can share with this one.
global:
  # -- Registry for every image of this chart, including the bundled Postgres.
  # Takes precedence over registry, image.registry and
  # database.postgres.bundled.image.registry.
  imageRegistry: ""
  # -- Pull secrets for every pod of this chart, merged (union) with
  # imagePullSecrets.
  imagePullSecrets: []
  # -- Fallback pull policy where neither the image nor imagePullPolicy sets one.
  imagePullPolicy: ""

# -- Number of replicas. Keep 1 when agents or a Collector send OTLP to this
# release: live sessions are held in the memory of the pod that receives them,
# so with more replicas one session's traces and logs end up split across pods.
# Postgres (storage.backend "postgres") shares only runs and results between
# replicas (SELECT FOR UPDATE SKIP LOCKED claims), not live sessions.
replicaCount: 1

# -- Container image registry (prepended to image.repository). global.imageRegistry
# takes precedence.
registry: ghcr.io

# -- Global image tag override (defaults to Chart.appVersion)
tag: ""

# -- Image pull policy for every container. Empty falls back to
# global.imagePullPolicy, then IfNotPresent.
imagePullPolicy: ""

# -- Image pull secrets, merged with global.imagePullSecrets
imagePullSecrets: []

# -- Override the chart name
nameOverride: ""

# -- Override the full resource name
fullnameOverride: ""

# -- Override the release namespace
namespaceOverride: ""

# ==============================================================================
# Image
# ==============================================================================

image:
  # -- Container image registry (overrides global registry)
  registry: ""
  # -- Container image repository (org/name, without registry prefix)
  repository: agentevals-dev/agentevals
  # -- Container image tag (defaults to global tag, then Chart.appVersion)
  tag: ""
  # -- Container image digest, e.g. "sha256:...". Takes precedence over the tag.
  digest: ""
  # -- Container image pull policy (defaults to imagePullPolicy)
  pullPolicy: ""

# ==============================================================================
# Service Account
# ==============================================================================

serviceAccount:
  # -- Create a ServiceAccount
  create: false
  # -- Automount the service account token
  automount: true
  # -- ServiceAccount annotations
  annotations: {}
  # -- ServiceAccount name override
  name: ""

# ==============================================================================
# RBAC
# ==============================================================================

# -- Namespaced Role + RoleBinding granting the pod's ServiceAccount read
# access to Secrets. Enable this when the kubernetes secret resolver reads
# provider credentials from Secrets via in-cluster config.
rbac:
  # -- Create the Role and RoleBinding
  create: false
  # -- Restrict the Role to these Secret names. Required when create is true,
  # unless allowAllSecrets is set.
  secretNames: []
  # -- Explicit opt in to grant get on every Secret in the release namespace
  # when secretNames is empty. Any caller that can submit credential refs can
  # then make the server read any of those Secrets, so prefer listing names.
  allowAllSecrets: false

# ==============================================================================
# Pod
# ==============================================================================

# -- Pod annotations
podAnnotations: {}

# -- Additional pod labels
podLabels: {}

# -- Pod security context
podSecurityContext:
  fsGroup: 1000

# -- Container security context.
# When ephemeralVolume.enabled is true, emptyDir at /tmp keeps the root
# filesystem read-only safely. When ephemeralVolume.enabled is false the chart
# forces readOnlyRootFilesystem to false so /tmp stays writable.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# ==============================================================================
# Ephemeral Volume
# ==============================================================================

# -- Writable scratch space at /tmp (trace uploads, MCP temp files, streaming
# JSONL). HOME is set to /tmp/agentevals-home so Path.home()/.cache stays
# writable. When disabled the chart sets readOnlyRootFilesystem to false.
ephemeralVolume:
  # -- Enable emptyDir mount at /tmp
  enabled: true
  # -- Size limit for the emptyDir (Kubernetes 1.22+), e.g. "2Gi"
  sizeLimit: ""
  # -- Use "Memory" for tmpfs (faster, counts against memory limits); leave "" for node disk
  medium: ""

# ==============================================================================
# Service
# ==============================================================================

service:
  # -- Service type
  type: ClusterIP
  # -- UI / API HTTP port
  http:
    port: 8001
    containerPort: 8001
  # -- OTLP HTTP receiver port
  otlpHttp:
    port: 4318
    containerPort: 4318
  # -- OTLP gRPC receiver port
  otlpGrpc:
    port: 4317
    containerPort: 4317
  # -- MCP (Streamable HTTP) port
  mcp:
    port: 8080
    containerPort: 8080
  # -- gRPC API port (agentevals.api.v1alpha1)
  grpcApi:
    port: 8002
    containerPort: 8002

# ==============================================================================
# gRPC API
# ==============================================================================

grpcApi:
  # -- Serve the gRPC API next to the HTTP API. Every caller that can reach the port is
  # trusted, so expose it only to trusted callers.
  enabled: true
  # -- Turn on gRPC server reflection, for tools such as grpcurl
  reflection: false
  # -- Check readiness with the gRPC health service on the gRPC API port instead of HTTP
  # /api/health
  grpcReadinessProbe: false
  # -- Serve only the gRPC API on the pod network (--api-grpc-only). The web UI and
  # REST API, the OTLP receivers and MCP listen on 127.0.0.1 inside the pod, where
  # kubectl port-forward still reaches them. The Service exposes only grpc-api and
  # every probe uses the gRPC health service.
  only: false
  auth:
    # -- Require a Kubernetes ServiceAccount token on every gRPC API call except
    # health checks (--api-grpc-auth kubernetes). Renders a ClusterRole and
    # ClusterRoleBinding that let the chart's ServiceAccount create TokenReviews,
    # so it needs serviceAccount.create or serviceAccount.name. Covers only the
    # gRPC API: combine it with grpcApi.only.
    enabled: false
    # -- Audience the callers' tokens must be minted for
    audience: agentevals
    # -- ServiceAccounts allowed to call the API, as namespace/name. Required when
    # enabled: any pod can mint a token for any audience, so the audience alone
    # authorizes nothing. Entries are templates, so a parent chart can write
    # "{{ .Release.Namespace }}/{{ .Release.Name }}-caller".
    allowedServiceAccounts: []

# ==============================================================================
# Resources
# ==============================================================================

# -- Container resource requests and limits
resources: {}

# ==============================================================================
# Scheduling
# ==============================================================================

# -- Node selector
nodeSelector: {}

# -- Tolerations
tolerations: []

# -- Affinity rules
affinity: {}

# ==============================================================================
# Overrides
# ==============================================================================

# -- Override the image entrypoint
command: []

# -- Override the image arguments. The image starts the MCP listener with
# --mcp-port 8080; to drop it, pass the full command line without that flag:
#   args: ["agentevals", "serve", "--host", "0.0.0.0", "--port", "8001",
#          "--otlp-http-port", "4318", "--otlp-grpc-port", "4317"]
args: []

# -- Extra environment variables appended to the container env block
env: []

# -- Extra envFrom sources (ConfigMapRef, SecretRef)
envFrom: []

# -- Extra volumes appended to the pod spec. Use this to mount additional
# config files or secrets (e.g. result-sink credentials) into the pod.
extraVolumes: []

# -- Extra volumeMounts appended to the main container. Pair with
# extraVolumes by name. securityContext.readOnlyRootFilesystem is true by
# default; that only makes the root filesystem read-only, mounted paths
# themselves are unaffected, so a writable extraVolumes entry works fine.
extraVolumeMounts: []

# ==============================================================================
# STORAGE  (preview feature)
#
# Persistent run history backed by Postgres is under active development.
# storage.* and database.postgres.* keys, and the underlying schema, may
# change incompatibly in upcoming releases. Treat persisted runs and
# results as ephemeral; recreate the agentevals schema when upgrading
# between minor versions. Default in-memory backend is unaffected.
# ==============================================================================

storage:
  # -- Storage backend. "memory" (default) keeps the developer experience
  # zero-config: nothing persisted, restarts lose in-flight state. "postgres"
  # enables /api/runs and persists runs + results in Postgres (preview).
  backend: memory

# ==============================================================================
# DATABASE CONFIGURATION
# ==============================================================================
# Used only when storage.backend is "postgres". Priority order (first match wins):
#   1. database.postgres.urlFile  -- file-based DSN (workload identity friendly)
#   2. database.postgres.url      -- literal DSN
#   3. database.postgres.bundled  -- chart-bundled Postgres (dev/eval only)
# If none is configured the chart fails to render.

database:
  postgres:
    # -- External Postgres connection string.
    # When set, takes precedence over the bundled instance regardless of
    # database.postgres.bundled.enabled.
    url: ""
    # -- Path to a file containing the connection string. Takes precedence
    # over url when set. Useful for projected workload-identity tokens.
    urlFile: ""
    # -- Postgres schema to use for agentevals tables.
    schema: agentevals
    # -- Apply pending database migrations during server startup before the
    # HTTP listener opens. The Postgres advisory lock serialises concurrent
    # replica starts so this is safe with replicaCount > 1. When set to
    # false the server refuses to start if the schema is behind or dirty;
    # run "agentevals migrate up" manually in that case.
    autoMigrate: true
    # -- Seconds the startup will spend retrying the initial Postgres
    # connection before the pod aborts. Default 600s matches the chart's
    # hard-coded startupProbe budget (failureThreshold 60 x periodSeconds
    # 10). Going above 600s requires overriding the probe in your own
    # downstream template.
    connectTimeoutSeconds: 600
    # -- Bundled Postgres instance for development and evaluation only.
    # Not suitable for production. Deployed when enabled is true and url /
    # urlFile are not set.
    bundled:
      # -- Set to true to deploy a chart-managed Postgres alongside the app.
      # Off by default so the zero-config install stays in-memory.
      enabled: false
      image:
        # -- Bundled Postgres image registry
        registry: docker.io
        # -- Bundled Postgres image repository (org/namespace)
        repository: library
        # -- Bundled Postgres image name
        name: postgres
        # -- Bundled Postgres image tag
        tag: "18.3-alpine"
        # -- Bundled Postgres image pull policy (defaults to imagePullPolicy)
        pullPolicy: ""
      # -- PersistentVolumeClaim size for the bundled Postgres data
      storage: 1Gi
      # -- StorageClass for the PVC. Defaults to the cluster default when empty.
      storageClassName: ""
      # The database name, user, and password are hardcoded for the bundled
      # instance (all: "agentevals"). This is intentional for a dev/eval
      # setup. Switch to an external database for production.
      # -- Resource requests/limits for the bundled Postgres container
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

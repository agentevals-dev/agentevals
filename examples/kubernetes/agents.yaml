# Two kagent agents with the same prompt and tools: one on the Go ADK runtime, one on the
# Claude Code harness. kagent-default and claude-default are the Harnesses that
# `kagent install` creates in the kagent namespace.
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: adk-go-test
  namespace: kagent
spec:
  template:
    inline:
      description: Go ADK test agent.
      modelConfig:
        name: default-model-config
      systemPrompt: You are a helpful assistant running on kagent.
      tools:
        - mcp:
            server:
              kind: RemoteMCPServer
              name: kagent-tool-server
  harnessRef:
    name: kagent-default
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: claude-test
  namespace: kagent
spec:
  template:
    inline:
      description: Claude Code harness test agent.
      modelConfig:
        name: default-model-config
      systemPrompt: You are a helpful assistant running on kagent.
      tools:
        - mcp:
            server:
              kind: RemoteMCPServer
              name: kagent-tool-server
  harnessRef:
    name: claude-default

# OpenTelemetry Collector between kagent and agentevals.
#
# traces and logs from kagent go to agentevals; evaluation results that agentevals sends back
# are printed by the debug exporter (kubectl logs deploy/otel-collector).
#
# filter/kagent_taskstore drops kagent's TaskStore gRPC spans: one per streamed chunk, up to
# 99% of a turn's spans. Without it a long turn passes the 10,000 spans per trace that
# agentevals keeps, and the turn loses its invoke_agent span.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: agentevals
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20

      filter/kagent_taskstore:
        error_mode: ignore
        traces:
          span:
            - IsMatch(span.attributes["rpc.method"], "^kagent\\.runtime\\.v1\\.TaskStoreService/")

      filter/not_from_agentevals:
        error_mode: ignore
        logs:
          log_record:
            - resource.attributes["service.name"] == "agentevals"

      filter/only_from_agentevals:
        error_mode: ignore
        logs:
          log_record:
            - resource.attributes["service.name"] != "agentevals"

    exporters:
      otlp_http/agentevals:
        endpoint: http://agentevals.agentevals.svc.cluster.local:4318
      debug:
        verbosity: detailed

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, filter/kagent_taskstore]
          exporters: [otlp_http/agentevals]
        logs/agentevals:
          receivers: [otlp]
          processors: [memory_limiter, filter/not_from_agentevals]
          exporters: [otlp_http/agentevals]
        logs/results:
          receivers: [otlp]
          processors: [memory_limiter, filter/only_from_agentevals]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: agentevals
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
      annotations:
        # bump to restart the Collector after editing the ConfigMap
        config-revision: "3"
    spec:
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector-contrib:0.162.0
          args: ["--config=/conf/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          volumeMounts:
            - name: conf
              mountPath: /conf
      volumes:
        - name: conf
          configMap:
            name: otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: agentevals
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
